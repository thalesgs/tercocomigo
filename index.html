<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Reze o terço guiado, ofereça por quem você ama e some com a sua comunidade.">
<meta name="theme-color" content="#f4ecda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Terço Comigo">
<meta property="og:title" content="Terço Comigo">
<meta property="og:description" content="Reze o terço guiado e ofereça por quem você ama.">
<meta property="og:image" content="https://tercocomigo.com.br/og.png">
<meta property="og:url" content="https://tercocomigo.com.br/">
<meta property="og:type" content="website">
<title>Terço Comigo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
/* Layout: página de missal no celular. Moldura com fio duplo, rubricas em vermelho, texto rezado em preto,
   fita marcadora na cor do mistério. Três abas: Rezar, Alavancas, Perfil. */
:root{
  --paper:#f4ecda; --leaf:#fbf6ea; --ink:#231c14; --ink-soft:#6b5e4c;
  --rubric:#a3221b; --gold:#a87f2c; --rule:#d8c9a8; --ribbon:#2f4f8f; --hl:#efd99b;
  --display:"Cinzel","Trajan Pro",Georgia,serif; --text:"EB Garamond",Garamond,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#17130e; --leaf:#201a13; --ink:#ede3cc; --ink-soft:#a99b83;
  --rubric:#e2725f; --gold:#d6b061; --rule:#3d3326; --hl:#7a5c1e; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#17130e; --leaf:#201a13; --ink:#ede3cc; --ink-soft:#a99b83;
  --rubric:#e2725f; --gold:#d6b061; --rule:#3d3326; --hl:#7a5c1e; color-scheme:dark}
html,body{height:100%}
html{font-size:calc(16px * var(--scale,1))}
body{background:var(--paper);color:var(--ink);font-family:var(--text);font-size:1.125rem}
.app{position:relative;max-width:500px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
.ribbon{position:absolute;top:0;right:max(28px,calc(env(safe-area-inset-right,0px) + 28px));width:16px;height:70px;background:var(--ribbon);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);transition:background .4s}
header{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px}
.brand{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.14em;color:var(--ink)}
.brand b{color:var(--rubric);font-weight:700}
.day{font-style:italic;color:var(--ink-soft);font-size:.95rem}
nav.tabs{display:flex;justify-content:center;gap:22px;border-block:1px solid var(--rule);padding-block:8px}
nav.tabs button{font:500 .78rem var(--display);letter-spacing:.16em;text-transform:uppercase;background:none;border:0;color:var(--ink-soft);cursor:pointer;padding:4px 0;border-bottom:2px solid transparent}
nav.tabs button.on{color:var(--rubric);border-bottom-color:var(--rubric)}
.view{display:flex;flex-direction:column;gap:14px}
.sets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sets button{font:500 .72rem var(--display);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border-radius:2px;border:1px solid var(--rule);background:transparent;color:var(--ink-soft);cursor:pointer}
.outras{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.outras button.outtog{align-self:flex-start;background:none;border:0;padding:4px 0;font:italic 1.05rem var(--text,inherit);letter-spacing:0;text-transform:none;color:var(--rubric);cursor:pointer}
.outras .outtog[aria-expanded="true"] span{display:inline-block;transform:rotate(180deg)}
.outras .row.wrap{flex-wrap:wrap;gap:8px}
.outras button{font:500 .72rem var(--display,inherit);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;border:1px solid var(--rule);background:var(--leaf);color:var(--ink);cursor:pointer;border-radius:2px}
#ora .oratio{white-space:pre-line}
#ora .oratio::first-letter{float:none;font:inherit;color:inherit;margin:0;padding:0;line-height:inherit}
#ora .oratio[data-p="0"]::first-letter{color:var(--rubric);font-weight:600}
#ora .now{background:color-mix(in srgb,var(--rubric) 10%,transparent);outline:1px solid color-mix(in srgb,var(--rubric) 35%,transparent);outline-offset:4px}
.sets button .dur{display:block;font:italic 400 .82rem var(--text);letter-spacing:0;text-transform:none;opacity:.8;margin-top:2px}
.prece{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.sets button.on{border-color:var(--rubric);color:var(--rubric);background:var(--leaf)}
.offer{border:1px solid var(--rubric);background:var(--leaf);padding:10px 14px;font-size:.98rem;display:flex;gap:10px;align-items:center;justify-content:space-between}
.offer em{color:var(--rubric)}
.audio{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.audio button{font:500 .72rem var(--display);letter-spacing:.12em;text-transform:uppercase;padding:9px 12px;border:1px solid var(--ink-soft);background:transparent;color:var(--ink);cursor:pointer;border-radius:2px}
.audio button.on{background:var(--ink);color:var(--paper)}
select,input,textarea{font:1rem var(--text);padding:8px;border:1px solid var(--rule);background:var(--leaf);color:var(--ink);border-radius:2px;min-width:0}
.audio select{flex:1 1 100px;font-size:.9rem}
.small{font-size:.85rem;color:var(--ink-soft);font-style:italic}
.audio .small{flex-basis:100%}
.beads{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0}
.beads::before{content:"";position:absolute;left:8%;right:8%;top:50%;height:1px;background:var(--ink-soft);opacity:.5}
.b{position:relative;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink-soft);background:var(--paper);transition:transform .2s,background .2s}
.b.big{width:18px;height:18px}
.b.done{background:var(--ink);border-color:var(--ink)}
.b.now{background:var(--rubric);border-color:var(--rubric);transform:scale(1.35)}
.meta{display:flex;justify-content:space-between;font:500 .7rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.page{position:relative;background:var(--leaf);padding:26px 22px;display:flex;flex-direction:column;gap:12px;flex:1;
  outline:1px solid var(--rubric);outline-offset:-8px;box-shadow:inset 0 0 0 11px var(--leaf),inset 0 0 0 12px var(--rule)}
.page.tap{cursor:pointer}
.rub{font-style:italic;color:var(--rubric);font-size:.95rem;margin:0}
.page h2{font-family:var(--display);font-weight:500;font-size:1.55rem;letter-spacing:.04em;line-height:1.2;margin:0;text-wrap:balance}
.page h2::before{content:"✠ ";color:var(--rubric)}
.oratio{line-height:1.6;margin:0;white-space:pre-line;font-size:1.12rem}
.oratio::first-letter{font-family:var(--display);font-weight:700;color:var(--rubric);float:left;font-size:3.3em;line-height:.82;padding:6px 8px 0 0}
.count{display:flex;align-items:center;gap:14px;border-block:1px solid var(--rule);padding-block:8px}
.num{font-family:var(--display);font-weight:700;font-size:2.8rem;line-height:1;color:var(--rubric);font-variant-numeric:tabular-nums;min-width:1.6em;text-align:center}
.of{display:flex;flex-direction:column;gap:6px;flex:1}
.of span{font-style:italic;color:var(--ink-soft);font-size:.95rem}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:7px;border:1px solid var(--ink-soft);border-radius:1px}
.dots i.done{background:var(--ink);border-color:var(--ink)}
.dots i.now{background:var(--rubric);border-color:var(--rubric)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:500 .8rem var(--display);letter-spacing:.14em;text-transform:uppercase;padding:15px 16px;border-radius:2px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.red{background:var(--rubric);border-color:var(--rubric);color:var(--leaf)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink-soft)}
.btn.slim{padding:7px 10px}
.btn:disabled{opacity:.4;cursor:default}
.grow{flex:1}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--rubric);outline-offset:2px}
.end{align-items:center;text-align:center}
.end img{width:100%;max-width:280px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.item{display:flex;flex-direction:column;gap:2px;padding:12px 2px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.item strong{font-weight:600;font-size:1.05rem}
.item span{font-style:italic;color:var(--ink-soft);font-size:.9rem}
h3{font:500 .75rem var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--rubric);margin:6px 0 0}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.95rem;color:var(--ink-soft);font-style:italic}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--rule)}
.stat div{padding:12px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stat div+div{border-left:1px solid var(--rule)}
.stat b{font-family:var(--display);font-size:1.6rem;color:var(--rubric);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--ink-soft);font-style:italic}
.me{display:flex;gap:14px;align-items:center}
.me img{width:56px;height:56px;border-radius:50%;border:1px solid var(--rule)}
.me strong{font-family:var(--display);font-weight:500;font-size:1.2rem;letter-spacing:.04em}
.faces{display:flex;flex-wrap:wrap;gap:4px}
.faces img{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule)}
.letter{border-left:2px solid var(--rubric);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:2px}
.letter span{font-size:.85rem;color:var(--ink-soft);font-style:italic}
.letter q{font-style:italic}
.share{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--gold);padding:12px}
.share input{width:100%;font-size:.85rem}
.checks{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.checks label{flex-direction:row;align-items:center;gap:10px;font-style:normal;color:var(--ink)}
.checks label.col{flex-direction:column;align-items:stretch;font-style:italic;color:var(--ink-soft)}
.ad{position:fixed;left:0;right:0;bottom:0;background:var(--leaf);border-top:1px solid var(--rule);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ad div{max-width:500px;margin:0 auto;display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--ink-soft)}
.ad b{font:500 .6rem var(--display);border:1px solid var(--rule);padding:2px 5px;letter-spacing:.1em}
.com{text-align:center;font-style:italic;color:var(--ink-soft);font-size:.95rem;border-bottom:1px solid var(--rule);padding-bottom:10px}
.com b{font-family:var(--display);font-style:normal;color:var(--rubric);font-size:1.15rem}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:6px}
.seg{display:flex;border:1px solid var(--rule)}
.seg button{background:none;border:0;padding:8px 12px;font:500 .72rem var(--display);letter-spacing:.08em;color:var(--ink-soft);cursor:pointer;min-width:44px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--ink);color:var(--paper)}
.tbl{overflow-x:auto;border-top:1px solid var(--rule)}
.tbl table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
.tbl th{font:500 .62rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--rubric)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,15,10,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.modal .page{width:100%;max-width:500px;max-height:100%;overflow-y:auto;flex:none}
.modal .page>*{flex-shrink:0}
.modal .page{position:relative}
.mclose{position:absolute;top:10px;right:10px;width:40px;height:40px;border:1px solid var(--rule);background:var(--leaf);color:var(--ink);font-size:1.2rem;border-radius:50%;cursor:pointer;line-height:1}
.movsel{width:100%}
.chip .x{margin-left:6px;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.9rem;padding:7px 11px;border:1px solid var(--rule);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer}
.chip.on{background:var(--rubric);border-color:var(--rubric);color:var(--leaf)}
.plist{display:flex;flex-direction:column;border-top:1px solid var(--rule);max-height:240px;overflow-y:auto}
.plist button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 6px;border:0;border-bottom:1px solid var(--rule);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.plist button.on{background:var(--paper);box-shadow:inset 3px 0 0 var(--rubric)}
.plist span{font-size:.85rem;font-style:italic;color:var(--ink-soft)}
.linkbtn{background:none;border:0;padding:4px 0;font:inherit;font-size:.9rem;font-style:italic;color:var(--rubric);text-decoration:underline;cursor:pointer;align-self:center}
.com small{display:block;font-size:.82rem;margin-top:2px}
.grace{border:1px solid var(--gold);background:var(--paper);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
[hidden]{display:none!important}
#setlist{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#sair{padding:9px 12px}
.oratio.cont::first-letter{float:none;font:inherit;color:inherit;padding:0}
.page.prayer{box-sizing:border-box}
/* Texto da oração: cabe na tela e rola por dentro; com o áudio, a frase atual acende e um fundo acompanha a palavra falada */
/* O cartão da oração não rola: se o texto não couber, a letra diminui um pouco até caber dentro da moldura */
.page.prayer{max-height:min(54vh,560px);overflow:hidden}
/* Rezando: a tela fica do tamanho do celular. Nada de puxar a página; se a oração não couber, só o texto rola dentro da moldura */
html.praying,html.praying body{overflow:hidden;overscroll-behavior:none}
html.praying .app{min-height:0;height:100%;box-sizing:border-box;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
html.praying nav.tabs{display:none}
html.praying .ribbon{display:none}
.audio .sairbtn{margin-left:auto;border-color:var(--rubric)!important;color:var(--rubric)!important}
#nav #prev{flex:none;min-width:104px;font-size:.78rem;letter-spacing:.1em}
html.praying .page.prayer{flex:none}
.page.prayer #txt.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin-right:-8px;padding-right:8px}
#next.timing{background-image:linear-gradient(to right,rgba(255,255,255,.22),rgba(255,255,255,.22));background-repeat:no-repeat;background-size:0% 100%;animation:tc-fill var(--d,10s) linear forwards}
@keyframes tc-fill{to{background-size:100% 100%}}
.karaoke .w{opacity:.32;transition:opacity .35s ease,background-color .2s ease;border-radius:3px}
.karaoke .w.read{opacity:.85}
.karaoke .w.ph{opacity:1}
.karaoke .w.cur{opacity:1;background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
/* Com o áudio, o texto rola dentro do cartão: a frase atual fica sempre na primeira linha e as já rezadas sobem e somem em degradê, sem passar da moldura */
.karaoke.page{overflow:hidden}
.karaoke #txt{position:relative;flex:1;min-height:0;overflow:hidden;padding-top:1.4em;padding-bottom:60vh;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 1.4em,#000 calc(100% - 1.6em),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 1.4em,#000 calc(100% - 1.6em),transparent 100%)}
#adj{flex-basis:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 10px;align-items:end}
#adj .aj{display:flex;flex-direction:column;gap:4px;min-width:0}
#adj .aj span{font:500 .66rem var(--display,inherit);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
#adj .aj select{width:100%;min-width:0;flex:none}
#adj #ahint{grid-column:1/-1}
#lemb{flex-wrap:wrap}
/* Terço desenhado: painel escuro de propósito nos dois temas, como uma capela à noite */
.rwrap{background:#0d0b09;outline:1px solid var(--rule);display:flex;justify-content:center;padding-block:10px}
.rosary{display:block;height:clamp(130px,20vh,220px);width:auto;max-width:100%}
.rosary .bd{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.3);transition:opacity .6s ease,transform .6s cubic-bezier(.2,1.4,.4,1)}
.rosary .bd.on{opacity:1;transform:none}
.rosary .ch{stroke:#8d7d5f;stroke-width:1.1}
.rosary .bd.now circle,.rosary .bd.now ellipse,.rosary .bd.now .cz{fill:url(#rg-g);filter:drop-shadow(0 0 5px #f3c86a)}
.rosary.done circle{fill:url(#rg-g)}
.rosary.done{animation:shine 2.6s ease-in-out infinite alternate}
@keyframes shine{from{filter:drop-shadow(0 0 0 rgba(243,200,106,0))}to{filter:drop-shadow(0 0 9px rgba(243,200,106,.75))}}
@media (prefers-reduced-motion:reduce){.b,.ribbon,.rosary .bd{transition:none}.rosary.done{animation:none}}
</style>
</head>
<body>

<div class="app">
  <div class="ribbon" id="ribbon" aria-hidden="true"></div>
  <header><div class="brand"><b>✠</b> TERÇO COMIGO</div><div class="day" id="day"></div></header>
  <nav class="tabs" id="tabs">
    <button data-tab="rezar" class="on">Rezar</button>
    <button data-tab="alav">Alavancas</button>
    <button data-tab="perfil">Perfil</button>
    <button data-tab="painel" id="tab-painel" hidden>Painel</button>
  </nav>

  <section class="view" id="v-rezar">
    <div class="com" id="com" hidden></div>
    <div class="offer" id="resume" hidden></div>
    <div class="offer" id="lemb" hidden></div>
    <div class="sets" id="sets"></div>
    <div class="outras" id="outras"><button type="button" class="outtog" id="outtog" aria-expanded="false" aria-controls="outlist">Outras orações <span aria-hidden="true">▾</span></button><div class="row wrap" id="outlist" hidden></div></div>
    <div class="offer" id="offer" hidden></div>
    <div class="audio">
      <button id="listen" aria-pressed="false">Ouvir</button>
      <button id="aa" aria-label="Mudar o tamanho da letra">Aa</button>
      <button id="adjbtn" aria-expanded="false" aria-controls="adj">Ajustes</button>
      <button id="sair" class="sairbtn" hidden aria-label="Sair do terço (seu ponto fica guardado)">✕ Sair</button>
      <div id="adj" hidden>
      <label class="aj" id="aj-vgrav" hidden><span>Quem reza com você</span><select id="vgrav"><option value="thales" selected>Thales</option><option value="feminina">Jenifer</option></select></label>
      <label class="aj" id="aj-voice"><span>Voz do celular</span><select id="voice"></select></label>
      <label class="aj"><span>Velocidade</span><select id="rate"><option value="0.9">Mais devagar</option><option value="1" selected>Normal</option><option value="1.15">Mais rápido</option></select></label>
      <label class="aj"><span>Nos mistérios</span><select id="mode"><option value="pass" selected>Com passagem bíblica</option><option value="sil">Só o anúncio</option></select></label>
      <label class="aj"><span>Como rezar</span><select id="resp"><option value="todo" selected>A voz reza tudo</option><option value="resp">Eu respondo a 2ª parte</option></select></label>
      <label class="aj" id="aj-lad" hidden><span>No fim do terço</span><select id="ladopt"><option value="nao" selected>Sem a Ladainha</option><option value="sim">Com a Ladainha de Nossa Senhora</option></select></label>
      <span class="small" id="ahint">Voz do próprio celular, só para teste. Com o áudio ligado, o terço avança sozinho e a tela não apaga.</span>
      </div>
    </div>
    <div class="rwrap"><svg class="rosary" id="rosary" viewBox="0 0 300 380" aria-hidden="true"></svg></div>
    <div class="meta"><span id="stage"></span><span class="row" style="gap:12px;align-items:center"><span id="pct"></span></span></div>
    <article class="page" id="card" aria-live="polite"></article>
    <div class="row" id="nav">
      <button class="btn ghost" id="prev" aria-label="Voltar para a oração anterior">‹ Voltar</button>
      <button class="btn grow" id="next">Próxima</button>
    </div>
  </section>

  <section class="view" id="v-alav" hidden></section>

/* ---------- Continuar de onde parei ----------
   A cada oração o ponto do terço fica guardado no aparelho. Se o app fechar, travar ou o celular desligar,
   ao abrir de novo aparece o cartão para retomar. Vale por 36 horas. */
const PROG="terco-prog";
function loadProg(){try{const p=JSON.parse(localStorage.getItem(PROG)||"null");return p&&Date.now()-p.em<36*36e5?p:null}catch(e){return null}}
function clearProg(){try{localStorage.removeItem(PROG)}catch(e){}}
function saveProg(){const st=steps[i];if(!praying()||!st)return;
  const nome=st.k==="anuncio"?"anúncio do mistério":(P[st.k]?P[st.k][0]:"")+(st.of>1?`, ${st.n}ª de ${st.of}`:"");
  try{localStorage.setItem(PROG,JSON.stringify({set,i,n:steps.length,oferta,em:Date.now(),label:`${$("stage").textContent} · ${nome}`}))}catch(e){}}
function renderResume(){const el=$("resume");if(!el)return;const p=praying()?null:loadProg();
  if(!p){el.hidden=true;return}
  el.hidden=false;el.innerHTML=`<span>Você parou no meio de um terço: <em></em>.</span><span class="row"><button class="btn red slim" id="rgo">Continuar</button><button class="btn ghost slim" id="rno">Começar de novo</button></span>`;
  el.querySelector("em").textContent=p.label||`Mistérios ${p.set}`;
  $("rgo").onclick=resumir;$("rno").onclick=()=>{clearProg();renderResume();track(x=>{x.descartouRetomar=(x.descartouRetomar||0)+1})}}
function resumir(){const p=loadProg();if(!p)return renderResume();
  set=p.set;registered=false;regErr=false;offered=false;runOn=false;runDone=false;comDone=false;comSkipped=false;porQuem="";build();
  if(steps.length!==p.n||p.i<1||p.i>=steps.length-1){clearProg();restart();return}
  i=p.i;emTerco=true;oferta=p.oferta||null;sets();render();track(x=>{x.retomou=(x.retomou||0)+1});window.scrollTo(0,0)}
function restart(){i=0;emTerco=false;registered=false;regErr=false;offered=false;runOn=false;runDone=false;comDone=false;comSkipped=false;porQuem="";build();sets();render()}

/* ---------- Terço desenhado ----------
   Peças em ordem de reza: 0 crucifixo, 1 conta grande, 2-4 três pequenas, 5 medalha,
   6-60 o círculo (cada dezena: 1 grande + 10 pequenas), saindo da medalha e subindo pelo lado direito de quem olha a tela. */
const RG=(()=>{const it=[{t:"cruz",x:150,y:342},{t:"big",x:150,y:302}];[288,275,262].forEach(y=>it.push({t:"small",x:150,y}));it.push({t:"medal",x:150,y:230});
  const seq=[];for(let d=0;d<5;d++){seq.push("big");for(let k=0;k<10;k++)seq.push("small")}
  const w=seq.map(s=>s==="big"?1.9:1),W=w.reduce((a,b)=>a+b,0),cx=150,cy=118,R=98,a0=Math.PI/2-.3,a1=Math.PI/2-2*Math.PI+.3;let acc=0;
  seq.forEach((s,k)=>{const a=a0+(a1-a0)*(acc+w[k]/2)/W;acc+=w[k];it.push({t:s,x:+(cx+R*Math.cos(a)).toFixed(1),y:+(cy+R*Math.sin(a)).toFixed(1)})});return it})();
function beadShape(b){if(b.t==="cruz")return`<g class="cz" fill="url(#rg-g)"><rect x="146" y="318" width="8" height="52" rx="2"/><rect x="133" y="332" width="34" height="8" rx="2"/></g>`;
  if(b.t==="medal")return`<ellipse cx="${b.x}" cy="${b.y}" rx="9" ry="11" fill="url(#rg-g)"/><ellipse cx="${b.x}" cy="${b.y}" rx="5.5" ry="7" fill="none" stroke="#7a5a1c" stroke-width="1"/>`;
  return`<circle cx="${b.x}" cy="${b.y}" r="${b.t==="big"?7.5:4.6}" fill="url(#rg-b)"/>`}
function buildRosary(){const s=$("rosary");let h=`<defs><radialGradient id="rg-b" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#e2d5b8"/><stop offset="1" stop-color="#9d8c69"/></radialGradient><radialGradient id="rg-g" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff3c9"/><stop offset=".55" stop-color="#e2b75a"/><stop offset="1" stop-color="#9a7020"/></radialGradient></defs>`;
  RG.forEach((b,k)=>{const p=k===1?{x:150,y:318}:RG[k-1];h+=`<g class="bd" data-k="${k}">${k?`<line class="ch" x1="${p.x}" y1="${p.y}" x2="${b.x}" y2="${b.y}"/>`:""}${beadShape(b)}</g>`});
  const l=RG[RG.length-1],m=RG[5];h+=`<g class="bd" data-k="close"><line class="ch" x1="${l.x}" y1="${l.y}" x2="${m.x}" y2="${m.y}"/></g>`;
  s.innerHTML=h;s.dataset.built="1"}
function curItem(st){if(set===MIS){if(st.d<0)return{abre:0,cruz:0,pai:1,ave:2,credo:st.half?4:3}[st.k];if(st.d<5)return 6+st.d*11+(st.k==="paixao"?st.n:0);return 999}
  if(st.d<0)return{abre:0,cruz:0,credo:0,pai:1,ave:1+(st.n||0),gloria:5}[st.k];
  if(st.d<5){const base=6+st.d*11;if(st.k==="ave")return base+st.n;if(st.k==="gloria"||st.k==="jesus")return base+10;return base}
  return 999}
function beads(st){const s=$("rosary");if(!s.dataset.built)buildRosary();const cur=curItem(st),done=cur===999;
  s.querySelectorAll(".bd").forEach(g=>{const k=g.dataset.k==="close"?(done?0:1e9):+g.dataset.k;g.classList.toggle("on",k<=cur);g.classList.toggle("now",k===cur)});
  s.classList.toggle("done",done)}
function drawRosary(g,ox,oy,sc){const P=b=>[ox+b.x*sc,oy+b.y*sc];g.save();g.strokeStyle="#8a7a5e";g.lineWidth=2.2;
  const seg=(a,b)=>{const [x1,y1]=P(a),[x2,y2]=P(b);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()};
  RG.forEach((b,k)=>{if(k)seg(k===1?{x:150,y:318}:RG[k-1],b)});seg(RG[RG.length-1],RG[5]);
  RG.forEach(b=>{const [x,y]=P(b);
    if(b.t==="cruz"){g.fillStyle="#a3221b";g.fillRect(ox+146*sc,oy+318*sc,8*sc,52*sc);g.fillRect(ox+133*sc,oy+332*sc,34*sc,8*sc);return}
    if(b.t==="medal"){g.fillStyle="#a87f2c";g.beginPath();g.ellipse(x,y,9*sc,11*sc,0,0,Math.PI*2);g.fill();return}
    const r=(b.t==="big"?7.5:4.6)*sc,gr=g.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);gr.addColorStop(0,"#6b5a42");gr.addColorStop(1,"#231c14");g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()});
  g.restore()}
/* Salvar ou compartilhar a imagem: no app do Claude no celular abre as opções de compartilhar; no navegador, baixa o arquivo. */
let dlCap;
async function getDl(){if(dlCap===undefined){try{dlCap=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){dlCap=null}}return dlCap}
function dataUrlToBlob(u){const bin=atob(u.split(",")[1]),a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:"image/png"})}
/* No celular, a folha de compartilhar entrega a imagem como foto: no WhatsApp ela aparece direto na conversa.
   Onde isso não existir, a imagem é salva e o aviso explica como mandar como foto. */
const desktop=()=>{try{return matchMedia("(pointer:fine)").matches&&!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)}catch(e){return false}};
async function shareImg(img,name,btn,note){
  if(img&&img.src){try{const f=new File([dataUrlToBlob(img.src)],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){btn.disabled=true;
      try{await navigator.share({files:[f]});btn.disabled=false;note.textContent="Imagem enviada.";track(x=>{x.compartilhou=(x.compartilhou||0)+1});return}
      catch(e){btn.disabled=false;if(e&&e.name==="AbortError")return}}}catch(e){}}
  const d=await getDl();
  if(!d&&img&&img.src){try{const a=document.createElement("a");a.href=URL.createObjectURL(dataUrlToBlob(img.src));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){}
    note.textContent=desktop()?"Imagem baixada. Para ela aparecer como foto no WhatsApp, arraste a imagem acima para a conversa, ou use o clipe › Fotos e vídeos (não Documento).":"Se a imagem não abriu, toque e segure nela e escolha Salvar em Fotos. Depois envie pela galeria.";track(x=>{x.compartilhou=(x.compartilhou||0)+1});return}
  if(!d||!img||!img.src){note.textContent=desktop()?"Arraste a imagem acima direto para a conversa do WhatsApp.":"Toque e segure a imagem e escolha Salvar em Fotos.";return}
  btn.disabled=true;
  try{await d.save({filename:name,data:dataUrlToBlob(img.src)});note.textContent=desktop()?"Imagem salva. Para ela aparecer como foto no WhatsApp, arraste a imagem acima para a conversa, ou use o clipe › Fotos e vídeos (não Documento).":"Imagem pronta. Se o WhatsApp mandar como arquivo, salve em Fotos e envie pela galeria.";track(x=>{x.compartilhou=(x.compartilhou||0)+1})}
  catch(e){const c=e&&e.code;note.textContent=c==="declined"?"":c==="rate_limited"?"Já há uma janela aberta. Feche-a e tente de novo.":"Não deu para salvar por aqui. Toque e segure a imagem para salvar."}
  btn.disabled=false}

/* O cartão da oração ocupa só o espaço que sobra na tela, acima dos botões e do anúncio; o texto rola por dentro. */
function fitCard(){const c=$("card");if(!c||!c.classList.contains("prayer")){if(c){c.style.maxHeight="";c.style.height=""}return}
  if(praying())window.scrollTo(0,0);
  const nav=$("nav"),navH=nav&&!nav.hidden?nav.offsetHeight+14:0,pad=praying()?Math.max(12,parseFloat(getComputedStyle($("card").closest(".app")).paddingBottom)||12):24;
  const h=window.innerHeight-c.getBoundingClientRect().top-navH-pad;c.style.maxHeight=Math.max(200,Math.floor(h))+"px";
  /* Rezando, o cartão ocupa sempre a mesma altura: o botão "Próxima" não pula de lugar entre uma oração e outra */
  c.style.height=praying()||c.classList.contains("karaoke")?c.style.maxHeight:"";fitText()}
function fitText(){const c=$("card"),o=$("txt");if(!c||!o)return;o.classList.remove("scroll");o.style.fontSize="";let fs=parseFloat(getComputedStyle(o).fontSize),n=0;
  while(c.scrollHeight>c.clientHeight+1&&fs>=16&&n<20){fs-=1;o.style.fontSize=fs+"px";n++}
  /* Letra no mínimo de 15 px: se ainda assim não couber, o cartão fica do tamanho da tela e só o texto rola por dentro da moldura */
  if(c.scrollHeight>c.clientHeight+1){c.style.height=c.style.maxHeight;o.classList.add("scroll")}}
window.addEventListener("resize",()=>fitCard());
function askCom(){if(listening||askedNow||!db||!uid||perfil.perguntou||perfil.paroquia)return;if(!steps[i]||steps[i].k!=="fim")return;askedNow=true;setTimeout(()=>{if(steps[i]&&steps[i].k==="fim")openModal()},1500)}

  const card=$("card"); card.className="page end";
  const mine=alavs.filter(a=>perfil.minhas.includes(a.id));
  const can=db&&uid;
  card.innerHTML=`<p class="rub">Terço concluído</p><h2>Que Nossa Senhora interceda por você</h2>
   <div id="reg" class="checks">${can?`
     <p class="small" style="text-align:center">${registered?"✓ Terço registrado no seu caminho de oração.":regErr?"Não foi possível registrar agora.":"Registrando seu terço…"}</p>${regErr&&!registered?`<button class="btn ghost" id="retryreg">Tentar de novo</button>`:""}

  const txt=st.k==="anuncio"?`${st.title} ${modeOf()==="pass"?PASS[set][st.d][1]:""}`:(P[st.k]?txtOf(st):"");
  const skip=dt<txt.split(/\s+/).length*350*0.4;
  track(t=>{t.avancos=(t.avancos||0)+1;if(skip)t.pulos=(t.pulos||0)+1;const r=(t.tercos||[])[t.tercos.length-1];if(r&&runOn){r.av=(r.av||0)+1;if(skip)r.pulos=(r.pulos||0)+1}})}
function tSave(){if(!T||!db||!uid)return;clearTimeout(tTimer);const snap=JSON.parse(JSON.stringify(T));tTimer=setTimeout(()=>{db.doc("testes/"+uid).set(snap).catch(err)},1500)}
function track(fn){if(!T)return;try{fn(T)}catch(e){}T.ultima=Date.now();tSave()}
async function loadT(){try{const s=await db.doc("testes/"+uid).get();const now=Date.now();
  T=s.exists?JSON.parse(JSON.stringify(s.data())):{primeira:now,visitas:0,iniciados:0,concluidos:0,registrados:0,narracao:0,alavancasCriadas:0,entradas:0,abas:{},tercos:[]};
  T.visitas=(T.visitas||0)+1;T.aparelho=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"celular":"computador";track(()=>{})}catch(e){T=null}}
function trackStep(){if(!T||!steps[i])return;
  if(i>0&&!runOn){runOn=true;track(t=>{t.iniciados=(t.iniciados||0)+1;t.tercos=[...(t.tercos||[]).slice(-29),{em:Date.now(),misterios:set,passo:i,de:steps.length-1,ok:false}]})}
  else if(runOn){track(t=>{const r=(t.tercos||[])[t.tercos.length-1];if(r&&i>r.passo)r.passo=i})}
  if(steps[i].k==="fim"&&runOn&&!runDone){runDone=true;track(t=>{t.concluidos=(t.concluidos||0)+1;const r=t.tercos[t.tercos.length-1];if(r){r.ok=true;r.dur=Date.now()-r.em}})}}

  const c=document.createElement("button");c.className="btn ghost slim";c.textContent="Copiar convite";
  c.onclick=()=>{try{navigator.clipboard.writeText(link).then(()=>{c.textContent="Copiado"}).catch(()=>{c.textContent=link})}catch(e){c.textContent=link}};
  const w=document.createElement("a");w.className="btn ghost slim";w.style.textDecoration="none";w.target="_blank";w.rel="noopener";w.href="https://wa.me/?text="+encodeURIComponent(msg+"\n"+link);w.textContent="WhatsApp";
  r.append(c,w);row.append(s,sp,r);return row}
function renderMyCom(){const box=$("mycom");if(!box)return;box.innerHTML="";const p=minhaPar(),mv=perfil.movimentos||[];
  if(!p&&!mv.length){box.innerHTML=`<p class="small">Escolha sua paróquia e seus movimentos para somar seus terços aos da sua comunidade.</p><button class="btn ghost" id="mcadd">Escolher minha paróquia</button>`;$("mcadd").onclick=()=>openModal();return}
  if(p)box.append(shareRow(`${p.nome} · ${p.cidade}`,sumG("p:"+p.id),`${BASE}#par-${p.id}`,`✠ Vamos rezar o terço juntos? Cada terço que você rezar soma no total da nossa comunidade: ${p.nome}, ${p.cidade}.`));
  mv.forEach(id=>box.append(shareRow(movName(id),sumG("m:"+id),`${BASE}#mov-${id}`,`✠ Vamos rezar o terço juntos? Cada terço soma no total de ${movName(id)}.`)));
  const r=document.createElement("div");r.className="row";r.innerHTML=`<button class="btn ghost slim" id="mcch">Mudar</button><button class="btn ghost slim" id="mcdel">Apagar minha escolha</button>`;box.append(r);
  $("mcch").onclick=()=>openModal();
  $("mcdel").onclick=async()=>{await savePerfil({paroquia:null,movimentos:[]});renderMyCom();renderCom()}}

/* ---------- Preferências de leitura ---------- */
const ORIG_THEME=document.documentElement.dataset.theme;
let prefs={scale:1,theme:"auto"};try{prefs={...prefs,...JSON.parse(localStorage.getItem("terco-prefs")||"{}")}}catch(e){}
const SCALES=[0.9,1,1.15,1.3];
function applyPrefs(){const r=document.documentElement;r.style.setProperty("--scale",prefs.scale);
  if(prefs.theme==="auto"){if(ORIG_THEME)r.dataset.theme=ORIG_THEME;else delete r.dataset.theme}else r.dataset.theme=prefs.theme;
  document.querySelectorAll("#seg-fs button").forEach(b=>b.classList.toggle("on",+b.dataset.fs===+prefs.scale));
  document.querySelectorAll("#seg-th button").forEach(b=>b.classList.toggle("on",b.dataset.th===prefs.theme));
  try{localStorage.setItem("terco-prefs",JSON.stringify(prefs))}catch(e){}if(typeof fitCard==="function")fitCard()}
$("seg-fs").onclick=e=>{const v=e.target.closest("button");if(v&&v.dataset.fs){prefs.scale=+v.dataset.fs;applyPrefs();track(x=>{x.letra=prefs.scale})}};
$("seg-th").onclick=e=>{const v=e.target.closest("button");if(v&&v.dataset.th){prefs.theme=v.dataset.th;applyPrefs();track(x=>{x.tema=prefs.theme})}};
$("aa").onclick=()=>{const k=SCALES.indexOf(+prefs.scale);prefs.scale=SCALES[(k+1)%SCALES.length];applyPrefs();track(x=>{x.letra=prefs.scale})};
applyPrefs();

let kTok=0;
function etapa(r){const p=r.passo||0;if(p<8)return"nas orações iniciais";if(p>=(r.de||0)-1)return"na Salve-Rainha";return`no ${Math.min(5,Math.floor((p-8)/14)+1)}º mistério`}
async function renderPainel(){
  const v=$("v-painel"),my=++kTok;
  if(!db||!uid){v.innerHTML=noAccess();return}
  v.innerHTML=`<p class="small">Carregando o painel…</p>`;
  let rows=[];
  try{const s=await db.collection("testes").get();rows=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){v.innerHTML=`<p class="small">Não foi possível carregar o painel agora. Tente de novo em instantes.${esc(ecode(e))}</p>`;return}
  rows.sort((a,b)=>(b.ultima||0)-(a.ultima||0));
  const fbs=[];
  await Promise.all(rows.map(async r=>{try{const s=await db.collection(`testes/${r.id}/feedback`).get();s.docs.forEach(d=>fbs.push({uid:r.id,...d.data()}))}catch(e){}}));
  fbs.sort((a,b)=>(b.em||0)-(a.em||0));
  let ps={};try{ps=await user.profiles(rows.map(r=>r.id))}catch(e){}
  if(my!==kTok)return;
  const nm=id=>(ps[id]&&ps[id].name)||"Convidado";
  const sum=k=>rows.reduce((s,r)=>s+(r[k]||0),0);
  const ini=sum("iniciados"),con=sum("concluidos");
  const pct=(a,b)=>b?Math.round((a||0)/b*100)+"%":"—";
  const med=r=>{const d=(r.tercos||[]).filter(t=>t.ok&&t.dur).map(t=>t.dur);return d.length?Math.max(1,Math.round(d.reduce((a,b)=>a+b,0)/d.length/60000))+" min":"—"};
  const pressa=rows.flatMap(r=>(r.tercos||[]).filter(t=>t.ok&&((t.av&&(t.pulos||0)/t.av>0.5)||(t.dur&&t.dur<6*60000))).map(t=>({...t,uid:r.id}))).sort((a,b)=>b.em-a.em).slice(0,12);
  const parados=rows.flatMap(r=>(r.tercos||[]).filter(t=>!t.ok).map(t=>({...t,uid:r.id}))).sort((a,b)=>b.em-a.em).slice(0,12);
  v.innerHTML=`<article class="page"><p class="rub">Visível só para você</p><h2>Painel dos testes</h2>
   <div class="stat"><div><b>${rows.length}</b><span>pessoas</span></div><div><b>${con}</b><span>terços concluídos</span></div><div><b>${ini?Math.round(con/ini*100):0}%</b><span>chegam ao fim</span></div></div>
   <button class="btn ghost" id="kref">Atualizar</button></article>
   <h3>Por pessoa</h3>
   ${rows.length?`<div class="tbl"><table><thead><tr><th>Pessoa</th><th>Visitas</th><th>Última vez</th><th>Terços</th><th>Tempo médio</th><th>Pulou</th><th>Registrou</th><th>Ouviu</th><th>Alavancas</th><th>Aparelho</th></tr></thead><tbody id="ktb"></tbody></table></div>
   <p class="small">Terços: concluídos de iniciados. Alavancas: criadas / entradas. Ouviu: vezes que ligou a narração. Pulou: orações passadas rápido demais para terem sido rezadas.</p>`:`<p class="small">Ninguém abriu o app ainda. Os convidados aparecem aqui assim que entrarem.</p>`}
   <h3>Terços não concluídos</h3><div class="list" id="kpar">${parados.length?"":`<p class="small">Nenhum terço interrompido.</p>`}</div>
   <h3>Terços rezados com pressa</h3><div class="list" id="kpr">${pressa.length?"":`<p class="small">Nenhum até agora.</p>`}</div>
   <h3>Sugestões recebidas</h3><div class="view" style="gap:12px" id="kfb">${fbs.length?"":`<p class="small">Nenhuma sugestão ainda.</p>`}</div>`;
  const tb=$("ktb");
  rows.forEach(r=>{const tr=document.createElement("tr");
    [nm(r.id),r.visitas||0,r.ultima?quando(r.ultima):"—",`${r.concluidos||0} de ${r.iniciados||0}`,med(r),pct(r.pulos,r.avancos),r.registrados||0,r.narracao?`${r.narracao}×`:"não",`${r.alavancasCriadas||0} / ${r.entradas||0}`,r.aparelho||"—"].forEach(c=>{const td=document.createElement("td");td.textContent=c;tr.append(td)});if(tb)tb.append(tr)});
  parados.forEach(t=>{const d=document.createElement("div");d.className="item";d.style.cursor="default";
    const s=document.createElement("strong");s.textContent=`${nm(t.uid)} parou ${etapa(t)}`;
    const sp=document.createElement("span");sp.textContent=`Mistérios ${t.misterios||""} · ${quando(t.em)} · ${Math.round((t.passo||0)/(t.de||1)*100)}% do terço${t.pulos?` · pulou ${t.pulos} orações`:""}`;d.append(s,sp);$("kpar").append(d)});
  pressa.forEach(t=>{const d=document.createElement("div");d.className="item";d.style.cursor="default";
    const s=document.createElement("strong");s.textContent=`${nm(t.uid)} concluiu em ${Math.max(1,Math.round((t.dur||0)/60000))} min`;
    const sp=document.createElement("span");sp.textContent=`Mistérios ${t.misterios||""} · ${quando(t.em)} · pulou ${pct(t.pulos,t.av)} das orações`;d.append(s,sp);$("kpr").append(d)});
  fbs.forEach(f=>{const el=document.createElement("div");el.className="letter";const s=document.createElement("strong");s.textContent=nm(f.uid);
    const sp=document.createElement("span");sp.textContent=quando(f.em);const q=document.createElement("q");q.textContent=f.texto||"";el.append(s,sp,q);$("kfb").append(el)});
  $("kref").onclick=renderPainel;
}

$("day").textContent=`${DAYS[today]} · Mistérios ${BY_DAY[today]}`;
restart();renderOutras();
